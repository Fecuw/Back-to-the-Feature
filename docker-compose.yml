services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-btf}
      POSTGRES_USER: ${POSTGRES_USER:-btf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btf-local-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btf} -d ${POSTGRES_DB:-btf}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [control-plane]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis-local-password}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis-local-password} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [control-plane]
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    environment:
      PORT: 8090
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET:-orchestrator-local-secret-change-me}
      SESSION_IMAGE: back-to-the-feature/training-target:local
      SESSION_TTL_SECONDS: 1800
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    expose: ["8090"]
    networks: [control-plane]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-btf}:${POSTGRES_PASSWORD:-btf-local-password}@postgres:5432/${POSTGRES_DB:-btf}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-local-password}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-development-jwt-secret-must-be-changed}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ORCHESTRATOR_URL: http://orchestrator:8090
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET:-orchestrator-local-secret-change-me}
      CORS_ORIGIN: http://127.0.0.1:5173,http://127.0.0.1:4173
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-true}
      STAGE_ROOT: /stages
    volumes:
      - ./src/stages:/stages:ro
    ports:
      - "${API_PORT:-18080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      orchestrator: { condition: service_started }
    networks: [control-plane, edge]
    restart: unless-stopped

  training-image:
    image: back-to-the-feature/training-target:local
    build:
      context: infra/images/training-target
    profiles: ["images"]

networks:
  control-plane:
    driver: bridge
    internal: true
  edge:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
